name: 老工程专属精准兼容编译
on: push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: 固定兼容JDK11（老源码唯一稳定）
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: 锁定完美适配的Gradle 7.6.4
      run: gradle wrapper --gradle-version 7.6.4

    - name: 全局权限修复
      run: find . -name gradlew -exec chmod +x {} \;

    - name: 开启遗留API兼容+强制编译
      run: |
        PROJ_ROOT=$(dirname $(find . -name settings.gradle | head -1))
        cd $PROJ_ROOT
        echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
        echo "org.gradle.deprecation.trace=true" >> gradle.properties
        echo "android.useDeprecatedNdk=true" >> gradle.properties
        ./gradlew clean assembleRelease --stacktrace --continue

    - name: 导出成品APK
      uses: actions/upload-artifact@v4
      with:
        name: 最终编译成品APK
        path: "**/apk/release/*.apk"
