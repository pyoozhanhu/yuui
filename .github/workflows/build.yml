name: 安卓项目自动编译APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置JDK17编译环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译正式版APK
        run: ./gradlew clean assembleRelease

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: 成品APK
          path: app/build/outputs/apk/release/
