name: 版本精准对齐 终极编译
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 双向精准配对：Java17 + 兼容老源码Gradle版本
    - name: 配置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    # 锁定最后一个同时兼容 旧源码+Java17 的Gradle版本
    - name: 初始化Gradle
      run: gradle wrapper --gradle-version 7.6.4

    - name: 修复权限
      run: find . -name gradlew -exec chmod +x {} \;

    - name: 强制兼容遗留API 开始编译
      run: |
        PROJ_ROOT=$(dirname $(find . -name settings.gradle | head -1))
        cd $PROJ_ROOT
        ./gradlew clean assembleRelease --warning-mode none --continue

    - name: 下载成品APK
      uses: actions/upload-artifact@v4
      with:
        name: 编译成功APK
        path: "**/release/*.apk"
