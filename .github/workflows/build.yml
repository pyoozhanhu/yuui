name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 配置JDK
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: 云端自动补齐缺失文件
      run: gradle wrapper

    - name: 全局修复权限
      run: find . -name gradlew -exec chmod +x {} \;

    - name: 自动找源码+编译
      run: |
        PROJ_ROOT=$(dirname $(find . -name settings.gradle | head -1))
        cd $PROJ_ROOT
        ./gradlew clean assembleRelease

    - name: 打包导出APK
      uses: actions/upload-artifact@v4
      with:
        name: 成品可安装APK
        path: "**/release/*.apk"
